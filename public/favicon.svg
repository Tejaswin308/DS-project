<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ds-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5A8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="ds-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#ds-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Orbital Data Ring -->
  <circle cx="32" cy="32" r="18" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Connecting Data Lines -->
  <line x1="32" y1="32" x2="20" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="44" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="42" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="32" x2="22" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Analytical Node with Glow -->
  <circle cx="32" cy="32" r="6" fill="#FFFFFF" filter="url(#ds-glow)" />

  <!-- Orbital Data Nodes -->
  <circle cx="20" cy="22" r="3.5" fill="#FFFFFF" />
  <circle cx="44" cy="22" r="3.5" fill="#FFFFFF" />
  <circle cx="42" cy="42" r="3.5" fill="#FFFFFF" />
  <circle cx="22" cy="42" r="3.5" fill="#FFFFFF" />
</svg>